# Tool configuration only; this repo is not a package.

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]
# E501: the prompt in wwjd_bot_modal.py is one long string literal whose lines
# cannot be wrapped without changing the model input.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
